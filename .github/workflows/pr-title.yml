name: Lint PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            authentication
            domain
            devicecontrol
            ledger
            eventbus
            common
            app
            demo
            release
          requireScope: false
          # PRs are squash-merged with the PR title as the commit message
          # (see AGENTS.MD), so the title alone must be a valid Conventional
          # Commit — subject content isn't otherwise constrained here.
          subjectPattern: ^(?!\s*$).+$
          subjectPatternError: |
            The PR title's subject (after "type(scope): ") must not be empty.
