<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset your password</title>
</head>
<body style="margin:0; padding:24px; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
  <div style="max-width:480px; margin:0 auto; background-color:#ffffff; border:1px solid #e5e7eb; border-radius:8px; padding:24px;">
    <h1 style="margin:0 0 12px 0; font-size:18px; color:#111827;">Reset your password</h1>
    <p style="margin:0 0 16px 0; font-size:14px; color:#374151;">A password reset was requested for {{.Email}}.</p>
    <p style="margin:0 0 16px 0; font-size:14px;"><a href="{{.ResetURL}}" style="color:#2563eb;">Reset password</a></p>
    <p style="margin:0; font-size:12px; color:#6b7280;">This link expires in {{.ExpiresInMinutes}} minutes.</p>
  </div>
</body>
</html>
