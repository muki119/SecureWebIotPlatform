# This is the nginx config for the docker environment
# This config is for docker use since it proxies the host machine services using host.docker.internal
# If this config were to be used in a non-docker environment, it would point to nothing since the config is set to host.docker.internal which is only accessible from within a docker container
# This config assumes the backend service ports are the default specified in the code, if they are changed this config would need to be updated

worker_processes auto;
events {
    worker_connections 1024;
}
stream {

    upstream mqtt_backend {
        server host.docker.internal:1883;
    }
    server {
        listen 1883;
        proxy_pass mqtt_backend;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        # Default keep-alive time is 10 minutes
        proxy_timeout 1800s;
        proxy_buffer_size 3M;
        tcp_nodelay on;
    }
}

http {

    server {

        listen 80;
        server_name TestServer;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;

        location /api/v1/auth/ {
            proxy_pass http://host.docker.internal:2556;
        }

        location ~* /api/v1/(profile|domain) {
            proxy_pass http://host.docker.internal:2557;
        }

        location /api/v1/device/ {
            proxy_pass http://host.docker.internal:2558;
        }

        location /socket.io/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_pass http://host.docker.internal:2558/socket.io/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }


}