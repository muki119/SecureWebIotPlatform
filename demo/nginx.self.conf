# This is the nginx config for the local dev environment
# This config isnt for docker use since it proxies localhost services , if it were to be used in docker it would just point to itself
# This config assumes the backend service ports are the default specified in the code, if they are changed this config would need to be updated

worker_processes auto;
events {
    worker_connections 1024;
}
stream {
    upstream mqtt_backend {
        server localhost:1883;
    }
    server {
        listen 1883;
        proxy_pass mqtt_backend;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        # Default keep-alive time is 10 minutes
        proxy_timeout 1800s;
        proxy_buffer_size 3M;
        tcp_nodelay on;
    }
}

http {

    server {
        listen 80;
        server_name TestServer;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name TestServer;

        ssl_certificate ./certs/server.crt;
        ssl_certificate_key ./certs/server.key;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header server "Muki119";


        location / {
            proxy_pass http://localhost:5173;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /api/v1/auth/ {
            proxy_pass http://localhost:2556;
        }

        location ~* /api/v1/(profile|domain) {
            proxy_pass http://localhost:2557;
        }

        location /api/v1/device/ {
            proxy_pass http://localhost:2558;
        }

        location /socket.io/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;

            proxy_pass http://localhost:2558/socket.io/;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }


}